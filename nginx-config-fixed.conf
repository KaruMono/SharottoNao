server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.sharotto.com;
    index index.php index.html index.htm default.php default.htm default.html;
    access_log /www/sites/www.sharotto.com/log/access.log main;
    error_log /www/sites/www.sharotto.com/log/error.log;

    # ============ HTTP/2 缓冲区优化 ============
    http2_max_field_size 32k;
    http2_max_header_size 64k;

    # 增大代理缓冲区
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # 增大输出缓冲区
    output_buffers 2 64k;
    postpone_output 1460;

    # 增大客户端缓冲区
    client_body_buffer_size 32k;
    client_header_buffer_size 8k;
    large_client_header_buffers 8 32k;
    # ==========================================

    # ============ 压缩配置（关键修复） ============
    # 禁用 nginx 的 gzip（让 Nuxt 自己处理压缩）
    gzip off;
    # =========================================

    root /www/sites/www.sharotto.com/index;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/www.sharotto.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/www.sharotto.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000";

    # ============ Icon API 特殊处理 ============
    location ^~ /_nuxt_icon/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # 直接传递 Nuxt 的压缩内容，不做任何修改
        proxy_pass_header Content-Encoding;

        # JSON 响应缓存
        add_header Cache-Control "public, max-age=86400";
    }

    # ============ 反向代理配置（关键修复） ============
    location ^~ / {
        proxy_pass http://127.0.0.1:3000;

        # 代理缓冲区配置
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;

        # 代理头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # HTTP/1.1 支持
        proxy_http_version 1.1;

        # ========== 关键修复：直接传递压缩内容 ==========
        # 直接传递 Nuxt 的压缩响应，不做任何修改
        proxy_pass_header Content-Encoding;
        proxy_pass_header Content-Type;
        # =========================================

        proxy_ssl_server_name off;
        proxy_ssl_name $proxy_host;

        add_header X-Cache $upstream_cache_status;
    }
}
